name: Deploy Deriavic Apparel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm before setup-node asks for the pnpm executable while
      # configuring its dependency cache.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        env:
          NODE_ENV: production
          BASE_PATH: /Deriavic-Design-Hub/
          PORT: 4173
        run: pnpm --filter @workspace/deriavic-apparel run build

      - name: Verify build output
        run: test -f artifacts/deriavic-apparel/dist/public/index.html

      - name: Configure SPA fallback
        run: cp artifacts/deriavic-apparel/dist/public/index.html artifacts/deriavic-apparel/dist/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/deriavic-apparel/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
